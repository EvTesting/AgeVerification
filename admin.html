<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Review Dashboard</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: center; max-width: 300px; }
    img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; }
    .btn { padding: 10px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; color: #fff; font-weight: bold; width: 100%; }
    .code-box { background: #38bdf8; color: #000; padding: 10px; border-radius: 8px; font-weight: bold; display: inline-block; }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <p>Share this Admin Code with users: <span id="adminId" class="code-box">Connecting...</span></p>

  <div id="requestsList">Waiting for incoming submissions...</div>

  <script>
    const peer = new Peer();
    const activeConnections = {};

    peer.on('open', (id) => {
      document.getElementById('adminId').textContent = id;
    });

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'submit') {
          activeConnections[data.userId] = conn;
          displaySubmission(data.userId, data.photo);
        }
      });
    });

    function displaySubmission(userId, photo) {
      const container = document.getElementById('requestsList');
      container.innerHTML = `
        <div class="card" id="card-${userId}">
          <img src="${photo}">
          <p>User: ${userId}</p>
          <button class="btn" style="background:#22c55e" onclick="approve('${userId}', 'Under 13')">Assign: Under 13</button>
          <button class="btn" style="background:#f59e0b" onclick="approve('${userId}', '13-17')">Assign: 13-17</button>
          <button class="btn" style="background:#ef4444" onclick="approve('${userId}', '18+')">Assign: 18+</button>
        </div>
      `;
    }

    function approve(userId, ageGroup) {
      const conn = activeConnections[userId];
      if (conn) {
        conn.send({ type: 'approval', ageGroup: ageGroup });
      }
      document.getElementById(`card-${userId}`).remove();
    }
  </script>
</body>
</html>
