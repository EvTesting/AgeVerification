<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamHub</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --warning-color: #ef4444;
      --success-color: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Profile Container & Dropdown Options */
    .profile-container {
      position: relative;
    }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-color);
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
      border: 2px solid #fff;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-unverified {
      background-color: var(--warning-color);
      color: #fff;
    }

    .badge-verified {
      background-color: var(--success-color);
      color: #fff;
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 50px;
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      width: 200px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow: hidden;
    }

    .dropdown-item {
      display: block;
      width: 100%;
      padding: 12px 16px;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: #334155;
    }

    .dropdown-divider {
      height: 1px;
      background-color: #334155;
    }

    /* Catalog Displays */
    .main-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .shows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .show-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
    }

    .show-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background-color: #0f172a;
    }

    .show-details {
      padding: 12px;
    }

    .show-details h4 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .rating-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 6px;
      background: var(--accent-color);
      color: #000;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .show-details p {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    /* Modal Verification Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      border: 1px solid #334155;
    }

    .camera-box {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 15px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent-color);
      background-color: #000;
    }

    video, #previewImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .guide-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: inset 0 0 0 12px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-secondary {
      background-color: #64748b;
      color: #fff;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top: 4px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand-title">StreamHub</div>

    <div class="profile-container">
      <button class="profile-button" id="profileBtn">
        <span id="verificationBadge" class="status-badge badge-unverified">Unverified</span>
        <div class="profile-avatar">U</div>
      </button>

      <!-- Dropdown Menu -->
      <div id="profileDropdown" class="dropdown-menu hidden">
        <button class="dropdown-item" id="openVerifyOption">Verify Age</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" onclick="alert('Account Settings')">Settings</button>
      </div>
    </div>
  </header>

  <!-- Main Catalog View -->
  <div class="main-container">
    <h3 class="section-title">Explore Shows</h3>
    <div id="showsContainer" class="shows-grid"></div>
  </div>

  <!-- Verification Overlay Modal -->
  <div id="verificationModal" class="modal-overlay hidden">
    <div class="modal-card">

      <!-- Step 1: Camera UI -->
      <div id="cameraStep">
        <h2>Age Verification</h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Center your face inside the circle.</p>

        <div class="camera-box">
          <video id="video" autoplay playsinline muted></video>
          <img id="previewImg" class="hidden" alt="Photo Preview">
          <div class="guide-overlay"></div>
        </div>

        <canvas id="canvas" style="display: none;"></canvas>

        <button id="snapBtn" class="btn">Take Photo</button>
        <button id="retakeBtn" class="btn btn-secondary hidden">Retake</button>
        <button id="submitBtn" class="btn hidden">Submit for Review</button>
        <button id="cancelBtn" class="btn btn-secondary" style="margin-top: 8px;">Cancel</button>

        <div id="status" class="status-msg">Starting camera...</div>
      </div>

      <!-- Step 2: Spinning Loading State -->
      <div id="loadingStep" class="hidden">
        <h2>Reviewing Submission</h2>
        <div class="spinner"></div>
        <p style="font-size: 0.9rem; color: #94a3b8;">Your photo was sent to the admin.</p>
        <p style="color: var(--accent-color); font-weight: bold; margin-top: 8px;">Waiting for age group assignment...</p>
      </div>

      <!-- Step 3: Assigned Result & Close Button -->
      <div id="completedStep" class="hidden">
        <h2>Verification Complete!</h2>
        <p style="color: #94a3b8; margin-top: 8px;">Assigned Category:</p>
        <p id="assignedGroupBanner" style="color: var(--accent-color); font-weight: bold; font-size: 1.2rem; margin: 10px 0;"></p>
        <button id="closeModalBtn" class="btn">Close</button>
      </div>

    </div>
  </div>

  <script>
    const ADMIN_PEER_ID = 'auto-admin-hub-2026';
    const peer = new Peer();
    const userId = 'user_' + Math.random().toString(36).substr(2, 6);
    let conn = null;
    let photoData = null;
    let cameraStream = null;

    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const openVerifyOption = document.getElementById('openVerifyOption');
    const verificationModal = document.getElementById('verificationModal');

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('previewImg');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusDiv = document.getElementById('status');

    const cameraStep = document.getElementById('cameraStep');
    const loadingStep = document.getElementById('loadingStep');
    const completedStep = document.getElementById('completedStep');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const defaultShows = [
      { title: "Peppa Pig", rating: "Preschool", image: "https://images.unsplash.com/photo-1560703650-ef3e0f254ae0?w=400", description: "Fun adventures with Peppa and her family." },
      { title: "PAW Patrol", rating: "Preschool", image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400", description: "Heroic pups working together to protect the community." },
      { title: "Sesame Street", rating: "Preschool", image: "https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=400", description: "Learning numbers, letters, and friendship with Elmo." },
      { title: "Cyber Champions", rating: "13-17", image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400", description: "Teenagers competing in futuristic arena games." },
      { title: "Galactic Odyssey", rating: "18+", image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400", description: "An intense space exploration journey." }
    ];

    // Profile Dropdown Toggle
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      profileDropdown.classList.add('hidden');
    });

    // Modal Control
    openVerifyOption.addEventListener('click', () => {
      profileDropdown.classList.add('hidden');
      verificationModal.classList.remove('hidden');
      startCamera();
    });

    cancelBtn.addEventListener('click', closeModal);
    closeModalBtn.addEventListener('click', closeModal);

    function closeModal() {
      verificationModal.classList.add('hidden');
      stopCamera();
    }

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        });
        video.srcObject = cameraStream;
        await video.play();
        statusDiv.textContent = "Position your face and tap 'Take Photo'.";
      } catch (err) {
        statusDiv.textContent = "Camera access error. Use Live Server or HTTPS.";
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
    }

    async function loadCatalog(assignedRating = null) {
      const container = document.getElementById('showsContainer');
      container.innerHTML = '';
      let showList = defaultShows;

      try {
        const res = await fetch('shows.json');
        if (res.ok) {
          const data = await res.json();
          if (data && data.shows) showList = data.shows;
        }
      } catch (e) {
        console.log('Using default show catalog fallback.');
      }

      if (assignedRating) {
        showList = showList.filter(show => show.rating === assignedRating || show.rating === 'Preschool');
      }

      showList.forEach(show => {
        const card = document.createElement('div');
        card.className = 'show-card';
        card.innerHTML = `
          <img src="${show.image || 'https://via.placeholder.com/300x150'}" alt="${show.title}">
          <div class="show-details">
            <span class="rating-tag">${show.rating}</span>
            <h4>${show.title}</h4>
            <p>${show.description}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    snapBtn.addEventListener('click', () => {
      canvas.width = 300;
      canvas.height = 300;
      canvas.getContext('2d').drawImage(video, 0, 0, 300, 300);

      photoData = canvas.toDataURL('image/jpeg', 0.7);
      previewImg.src = photoData;

      video.classList.add('hidden');
      previewImg.classList.remove('hidden');

      snapBtn.classList.add('hidden');
      retakeBtn.classList.remove('hidden');
      submitBtn.classList.remove('hidden');
      statusDiv.textContent = "Review photo before submitting.";
    });

    retakeBtn.addEventListener('click', () => {
      previewImg.classList.add('hidden');
      video.classList.remove('hidden');

      snapBtn.classList.remove('hidden');
      retakeBtn.classList.add('hidden');
      submitBtn.classList.add('hidden');
      statusDiv.textContent = "Position your face and tap 'Take Photo'.";
    });

    submitBtn.addEventListener('click', () => {
      statusDiv.textContent = "Connecting to admin dashboard...";
      conn = peer.connect(ADMIN_PEER_ID);

      conn.on('open', () => {
        conn.send({ type: 'submit', userId: userId, photo: photoData });
        cameraStep.classList.add('hidden');
        loadingStep.classList.remove('hidden');
      });

      conn.on('data', (data) => {
        if (data.type === 'approval') {
          stopCamera();
          loadingStep.classList.add('hidden');
          completedStep.classList.remove('hidden');
          document.getElementById('assignedGroupBanner').textContent = data.ageGroup;

          const badge = document.getElementById('verificationBadge');
          badge.textContent = data.ageGroup;
          badge.className = 'status-badge badge-verified';

          loadCatalog(data.ageGroup);
        }
      });

      peer.on('error', () => {
        statusDiv.textContent = "Could not connect to Admin. Open admin.html in another tab or device.";
      });
    });

    window.addEventListener('load', () => {
      loadCatalog();
    });
  </script>
</body>
</html>
