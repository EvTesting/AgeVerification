<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Age Verification</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .camera-box {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent-color);
      background-color: #000;
    }

    video, #previewImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .guide-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: inset 0 0 0 12px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-secondary {
      background-color: #64748b;
      color: #fff;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* Spinning Loading Indicator */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top: 5px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Verification UI -->
  <div id="verificationSection" class="container">
    <h2>Age Verification</h2>
    <p>Center your face in the circle and tap 'Take Photo'.</p>

    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <img id="previewImg" class="hidden" alt="Photo Preview">
      <div class="guide-overlay"></div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <button id="snapBtn" class="btn">Take Photo</button>
    <button id="retakeBtn" class="btn btn-secondary hidden">Retake</button>
    <button id="submitBtn" class="btn hidden">Submit Automatically</button>

    <div id="status" class="status-msg">Starting camera...</div>
  </div>

  <!-- Loading State Section -->
  <div id="loadingSection" class="container hidden">
    <h2>Review in Progress</h2>
    <div class="spinner"></div>
    <p>Your photo has been sent to the admin.</p>
    <p style="color: var(--accent-color); font-weight: bold;">Please wait while your age group is assigned...</p>
  </div>

  <!-- Unlocked Content Section -->
  <div id="contentSection" class="container hidden">
    <h2>Verification Complete!</h2>
    <p style="color: #94a3b8;">Your access profile:</p>
    <p id="assignedGroupBanner" style="color: var(--accent-color); font-weight: bold; font-size: 1.3rem; margin-top: 10px;"></p>
  </div>

  <script>
    // Shared fixed Peer ID to automatically find admin
    const ADMIN_PEER_ID = 'auto-admin-hub-2026';
    const peer = new Peer();
    const userId = 'user_' + Math.random().toString(36).substr(2, 6);
    let conn = null;
    let photoData = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('previewImg');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        });
        video.srcObject = stream;
        await video.play();
        statusDiv.textContent = "Camera ready. Position your face and take a photo.";
      } catch (err) {
        statusDiv.textContent = "Camera access blocked. Run via Live Server (http://localhost) or HTTPS.";
      }
    }

    snapBtn.addEventListener('click', () => {
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 300, 300);

      photoData = canvas.toDataURL('image/jpeg', 0.7);
      previewImg.src = photoData;

      video.classList.add('hidden');
      previewImg.classList.remove('hidden');

      snapBtn.classList.add('hidden');
      retakeBtn.classList.remove('hidden');
      submitBtn.classList.remove('hidden');
      statusDiv.textContent = "Review photo before submitting.";
    });

    retakeBtn.addEventListener('click', () => {
      previewImg.classList.add('hidden');
      video.classList.remove('hidden');

      snapBtn.classList.remove('hidden');
      retakeBtn.classList.add('hidden');
      submitBtn.classList.add('hidden');
      statusDiv.textContent = "Position your face and tap 'Take Photo'.";
    });

    submitBtn.addEventListener('click', () => {
      statusDiv.textContent = "Connecting to admin dashboard...";
      
      // Auto connect directly to Admin Hub
      conn = peer.connect(ADMIN_PEER_ID);

      conn.on('open', () => {
        conn.send({ type: 'submit', userId: userId, photo: photoData });
        
        // Hide camera UI and show spinning loading circle
        document.getElementById('verificationSection').classList.add('hidden');
        document.getElementById('loadingSection').classList.remove('hidden');
      });

      conn.on('data', (data) => {
        if (data.type === 'approval') {
          // Hide spinning circle and show final assigned category
          document.getElementById('loadingSection').classList.add('hidden');
          document.getElementById('contentSection').classList.remove('hidden');
          document.getElementById('assignedGroupBanner').textContent = data.ageGroup;
        }
      });

      peer.on('error', () => {
        statusDiv.textContent = "Could not reach Admin. Ensure admin.html is opened first on another tab/device.";
      });
    });

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
