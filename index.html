<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Verification</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
    .box { max-width: 400px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; }
    .camera-box { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; margin: 15px auto; border: 3px solid #38bdf8; background: #000; }
    video, img { width: 100%; height: 100%; object-fit: cover; }
    input { padding: 10px; border-radius: 6px; border: none; width: 80%; margin-bottom: 10px; text-align: center; }
    .btn { background: #38bdf8; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box" id="verifyBox">
    <h2>Age Verification</h2>
    <input type="text" id="adminCodeInput" placeholder="Enter Admin Code here">
    
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" class="hidden">
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <button id="snapBtn" class="btn">Take Photo</button>
    <button id="submitBtn" class="btn hidden">Submit to Admin</button>
    <p id="status"></p>
  </div>

  <div class="box hidden" id="catalogBox">
    <h2>Catalog Unlocked</h2>
    <p id="groupResult" style="color: #38bdf8; font-weight: bold;"></p>
  </div>

  <script>
    const peer = new Peer();
    const userId = 'user_' + Math.random().toString(36).substr(2, 6);
    let conn = null;
    let photoData = null;

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        status.textContent = "Camera error. Use Live Server or HTTPS.";
      }
    }

    document.getElementById('snapBtn').addEventListener('click', () => {
      const canvas = document.getElementById('canvas');
      canvas.width = 250;
      canvas.height = 250;
      canvas.getContext('2d').drawImage(video, 0, 0, 250, 250);
      photoData = canvas.toDataURL('image/jpeg', 0.6);

      preview.src = photoData;
      video.classList.add('hidden');
      preview.classList.remove('hidden');
      document.getElementById('snapBtn').classList.add('hidden');
      document.getElementById('submitBtn').classList.remove('hidden');
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      const adminCode = document.getElementById('adminCodeInput').value.trim();
      if (!adminCode) {
        alert("Please enter the Admin Code first!");
        return;
      }

      status.textContent = "Connecting to admin...";
      conn = peer.connect(adminCode);

      conn.on('open', () => {
        conn.send({ type: 'submit', userId: userId, photo: photoData });
        status.textContent = "Submitted! Waiting for approval...";
      });

      conn.on('data', (data) => {
        if (data.type === 'approval') {
          document.getElementById('verifyBox').classList.add('hidden');
          document.getElementById('catalogBox').classList.remove('hidden');
          document.getElementById('groupResult').textContent = "Rating: " + data.ageGroup;
        }
      });
    });

    startCamera();
  </script>
</body>
</html>
